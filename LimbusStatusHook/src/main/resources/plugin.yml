name: LimbusStatusHook
version: ${project.version}
main: com.luckyvn.limbusstatus.LimbusStatusHook
api-version: '1.21'
author: Crush_Seul
description: Hook OneBlockCore + MythicLib + MMOItems - hiển thị Keyword Status Effects (Limbus Company) trên Action Bar.
depend: [OneBlockCore, MythicLib, MMOItems]
commands:
  limbusstatus:
    description: Lệnh quản trị LimbusStatusHook.
    usage: /limbusstatus <reload|check|stats> [player]
    aliases: [lstatus, lbs]
    permission: limbusstatus.admin
permissions:
  limbusstatus.admin:
    description: Dùng lệnh /limbusstatus.
    default: op
