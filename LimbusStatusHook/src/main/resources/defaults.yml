# Giá trị mặc định khi config.yml của OneBlockCore chưa có mục actionbar.limbus.
# Bạn sửa trong plugins/OneBlockCore/config.yml, không sửa file này.
limbus:
  update-ticks: 10
  hide-zero: true
  format: "{color}{name} {value}"
  effects:
    burn:
      name: "Burn"
      color: "&#F97316"
      stats: [BURN, CUSTOM_BURN, LIMBUS_BURN]
    bleed:
      name: "Bleed"
      color: "&#DC2626"
      stats: [BLEED, CUSTOM_BLEED, LIMBUS_BLEED]
    tremor:
      name: "Tremor"
      color: "&#EAB308"
      stats: [TREMOR, CUSTOM_TREMOR, LIMBUS_TREMOR]
    rupture:
      name: "Rupture"
      color: "&#3B82F6"
      stats: [RUPTURE, CUSTOM_RUPTURE, LIMBUS_RUPTURE]
    sinking:
      name: "Sinking"
      color: "&#4F46E5"
      stats: [SINKING, CUSTOM_SINKING, LIMBUS_SINKING]
    poise:
      name: "Poise"
      color: "&#A3E635"
      stats: [POISE, CUSTOM_POISE, LIMBUS_POISE]
    charge:
      name: "Charge"
      color: "&#22D3EE"
      stats: [CHARGE, CUSTOM_CHARGE, LIMBUS_CHARGE]
      format: "{color}{name} {value}&7/20"
